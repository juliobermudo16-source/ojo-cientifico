name: Compilar APK de Ojo Científico

# Se ejecuta en cada push y también a mano desde la pestaña Actions.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Si se empuja dos veces seguidas, se cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Tests, lint y APK de depuración
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Restaurar el Gradle Wrapper si faltara
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "No se encontró gradle-wrapper.jar; se regenera con la versión declarada."
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          fi

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Limpiar
        run: ./gradlew clean --no-daemon

      # Si algún test falla, el workflow se detiene aquí y no se genera el APK.
      - name: Ejecutar los tests unitarios
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Publicar el informe de tests
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Ojo-Cientifico-informe-tests
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Analizar el código con lint
        run: ./gradlew lintDebug --no-daemon

      # lint está configurado con abortOnError = false: los avisos no rompen la
      # compilación, pero los errores se muestran aquí de forma explícita.
      - name: Resumir el resultado de lint
        if: always()
        run: |
          INFORME=app/build/reports/lint-results-debug.xml
          if [ ! -f "$INFORME" ]; then
            echo "No se generó el informe de lint." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ERRORES=$(grep -c 'severity="Error"' "$INFORME" || true)
          AVISOS=$(grep -c 'severity="Warning"' "$INFORME" || true)
          {
            echo "### Resultado de lint"
            echo ""
            echo "- Errores: **$ERRORES**"
            echo "- Avisos: **$AVISOS**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ERRORES" -gt 0 ]; then
            echo "::error::lint ha encontrado $ERRORES errores. Revisa el artefacto Ojo-Cientifico-informe-lint."
            exit 1
          fi

      - name: Publicar el informe de lint
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: Ojo-Cientifico-informe-lint
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Generar el APK de depuración
        run: ./gradlew assembleDebug --no-daemon

      # El APK de depuración se firma con la clave de depuración que genera el
      # propio Android SDK: no hace falta ningún secreto ni servicio externo.
      - name: Renombrar el APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/Ojo-Cientifico-debug.apk
          ls -lh apk/

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: Ojo-Cientifico-debug-apk
          path: apk/Ojo-Cientifico-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Resumen final
        if: always()
        run: |
          {
            echo "### Ojo Científico"
            echo ""
            echo "APK generado: \`Ojo-Cientifico-debug.apk\`"
            echo ""
            echo "Descárgalo desde la sección **Artifacts** de esta ejecución."
          } >> "$GITHUB_STEP_SUMMARY"

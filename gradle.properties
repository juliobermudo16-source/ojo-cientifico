# Ojo Cientifico — propiedades de Gradle
# No se fuerza file.encoding: en Windows debe coincidir con sun.jnu.encoding
# o los procesos hijos no resuelven rutas con tildes (esta carpeta lleva una).
org.gradle.jvmargs=-Xmx2560m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1536m

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false

# La carpeta del proyecto contiene una tilde (Ojo Cientifico). AGP lo avisa;
# la compilacion se ha verificado correctamente en esta ruta.
android.overridePathCheck=true
